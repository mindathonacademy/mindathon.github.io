{{HEAD}}
<body data-page="gallery">
{{NAVBAR}}

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Gallery</span>
      <h1>Real Mindathon</h1>
      <p>A look at the game — and the people who play it.</p>
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><span>Gallery</span>
      </nav>
    </div>
  </section>

  <section class="section-white">
    <div class="container">
      <div class="filter-bar reveal" role="group" aria-label="Filter gallery">
        <button class="filter-chip" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-chip" data-filter="product" aria-pressed="false">Product</button>
        <button class="filter-chip" data-filter="students" aria-pressed="false">Students</button>
        <button class="filter-chip" data-filter="programmes" aria-pressed="false">Programmes</button>
        <button class="filter-chip" data-filter="community" aria-pressed="false">Community</button>
      </div>

      <div class="gallery-grid reveal">
        <figure class="gallery-item" data-category="product" tabindex="0">
          <img src="assets/images/mindathon-box-1.jpg" alt="The Mindathon game box" loading="lazy">
          <figcaption>Mindathon — the game</figcaption>
        </figure>
        <figure class="gallery-item placeholder-gallery-item" data-category="students" tabindex="0" aria-disabled="true">
          <div class="placeholder-tile placeholder-in-grid">
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
              <span class="note">Students — photos coming soon</span>
            </div>
          </div>
          <figcaption>Students — coming soon</figcaption>
        </figure>
        <figure class="gallery-item placeholder-gallery-item" data-category="programmes" tabindex="0" aria-disabled="true">
          <div class="placeholder-tile placeholder-in-grid">
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span class="note">Programmes — photos coming soon</span>
            </div>
          </div>
          <figcaption>Programmes — coming soon</figcaption>
        </figure>
        <figure class="gallery-item placeholder-gallery-item" data-category="community" tabindex="0" aria-disabled="true">
          <div class="placeholder-tile placeholder-in-grid">
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span class="note">Community — photos coming soon</span>
            </div>
          </div>
          <figcaption>Community — coming soon</figcaption>
        </figure>
      </div>
    </div>
  </section>

  <section class="cta-band">
    <div class="container">
      <h2 class="reveal">Like what you see?</h2>
      <p class="reveal" style="--d:.1s">Get Mindathon or bring it to your school.</p>
      <div class="cta-actions reveal" style="--d:.2s">
        <a href="get-mindathon.html" class="btn btn-accent">Get Mindathon</a>
        <a href="contact.html" class="btn btn-ghost">Contact Us</a>
      </div>
    </div>
  </section>
</main>

{{FOOTER}}
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer">
  <img src="" alt="">
  <p class="caption"></p>
  <button class="lb-btn lb-close" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" aria-label="Previous image">‹</button>
  <button class="lb-btn lb-next" aria-label="Next image">›</button>
</div>
{{SCRIPTS}}
</body>
</html>
